version: 260527_v14_marker_registry
description: >
  Ontology-aware marker registry for HIPC single-cell annotation.
  LLM-assisted marker proposals are fixed here before deterministic scoring.
  Runtime annotation must use this registry as static input rather than asking
  the LLM to make per-cell decisions.

scoring:
  positive_weight: 1.0
  negative_weight: 0.7
  confound_weight: 0.8
  min_present_fraction_warning: 0.6
  min_present_fraction_critical: 0.3
  margin_warning: 0.08
  margin_confident: 0.18

labels:
  Blood Cell:
    broad_lineage: Artifact/Other
    applicable_lineage: Any
    marker_role: fallback_parent
    positive: []
    key: []
    negative: []
    confound: []
    notes: fallback for unresolved or ambiguous hematopoietic cells
    provenance: ontology_parent
  Platelet:
    broad_lineage: Artifact/Other
    applicable_lineage: Any
    marker_role: artifact
    positive: [PPBP, PF4, NRGN, GP9, GNG11, TUBB1]
    key: [PPBP, PF4]
    negative: [PTPRC, CD3D, MS4A1]
    confound: [HBB, HBA1, HBA2]
    notes: platelet or platelet-contaminated droplets
    provenance: curated
  RBC:
    broad_lineage: Artifact/Other
    applicable_lineage: Any
    marker_role: artifact
    positive: [HBB, HBA1, HBA2, HBD, ALAS2, SLC4A1]
    key: [HBB, HBA1, HBA2]
    negative: [PTPRC, CD3D, MS4A1]
    confound: [PPBP, PF4]
    notes: erythroid or red-cell contaminated droplets
    provenance: curated
  HSC:
